{% extends 'base.html' %}{% block content %}<div class="page-head"><div><div class="eyebrow">YOUR ACCOUNT</div><h1>Profile & settings</h1><p class="muted">Update your account details and password.</p></div><a class="btn secondary" href="{{ url_for('dashboard') }}">← Dashboard</a></div><section class="panel narrow"><form method="POST"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="username">Username</label><input class="field" id="username" name="username" minlength="3" maxlength="40" value="{{ current_user.username }}" required><label for="email">Email</label><input class="field" id="email" type="email" name="email" value="{{ current_user.email }}" required><div class="divider"></div><h3>Change password <span class="muted tiny">(optional)</span></h3><label for="new_password">New password</label><input class="field" id="new_password" type="password" name="new_password" minlength="8" autocomplete="new-password"><label for="confirm_password">Confirm new password</label><input class="field" id="confirm_password" type="password" name="confirm_password" minlength="8" autocomplete="new-password"><button class="btn primary">Save settings</button></form></section>{% endblock %}
