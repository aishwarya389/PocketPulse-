<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PocketPulse</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"><script src="https://cdn.jsdelivr.net/npm/chart.js"></script></head>
<body><nav class="navbar"><a class="brand" href="{{ url_for('dashboard') }}">◉ PocketPulse</a>{% if current_user.is_authenticated %}<div class="navlinks"><a href="{{ url_for('dashboard') }}">Dashboard</a><a href="{{ url_for('budget_page') }}">Budget</a><a href="{{ url_for('goals_page') }}">Savings goals</a><a href="{{ url_for('recurring_page') }}">Recurring</a><a href="{{ url_for('profile_page') }}">Profile</a><form method="POST" action="{{ url_for('logout') }}" class="inline-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="nav-logout">Logout</button></form></div>{% endif %}</nav>
<main class="container">{% for category, message in get_flashed_messages(with_categories=true) %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main><footer>PocketPulse · Take control of your money</footer></body></html>
